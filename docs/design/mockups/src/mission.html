<!doctype html>
<html lang="en" data-theme="dark" data-open="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom mockup: Mission control</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 13px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
ul,ol{list-style:none;margin:0;padding:0}
h1,h2,h3,p,dl,dd{margin:0}
.sp{flex:1}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* frame: fixed 900px tall, dot grid canvas */
.app{width:100%;max-width:1600px;height:900px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--bg-dots) 1px,transparent 1px);background-size:18px 18px}

/* top bar */
.top{flex:none;height:44px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:600 14px/1 var(--font-sans);letter-spacing:-.01em;margin-right:6px}
.mark{position:relative;width:13px;height:13px;border:2px solid var(--text);border-radius:2px;transform:rotate(45deg)}
.mark::after{content:"";position:absolute;inset:2px;background:var(--focus)}
.crumb{font:12px var(--font-mono);color:var(--text-3);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.counts{display:flex;gap:16px;font:12px var(--font-mono);color:var(--text-3);white-space:nowrap}
.counts b{font-weight:500;color:var(--c)}

.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel-2);color:var(--text-2);font-size:12px;white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--text-3)}
.btn[aria-pressed="true"]{color:var(--text);border-color:var(--text-2);background:var(--raised)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{color:var(--bg);opacity:.9}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn.sm{height:22px;padding:0 8px;font-size:11.5px}

/* health strip */
.health{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:34px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.hc{--c:var(--st-done);display:flex;align-items:center;gap:8px;min-width:0;padding:0 14px;border-right:1px solid var(--line);font-size:12px;color:var(--text-2)}
.hc:last-child{border-right:0}
.hc .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.hc b{flex:none;font:600 11px var(--font-mono);color:var(--text)}
.hc .st{flex:none;font:500 10.5px var(--font-mono);color:var(--c)}
.hc .trunc{flex:1}

/* home grid: fixed panels, no drag */
.home{flex:1;min-height:0;display:grid;gap:10px;padding:10px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:"wait run watch" "wait pile act" "notif pile act"}
.panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.p-wait{grid-area:wait;--accent:var(--st-hitl)}
.p-run{grid-area:run;--accent:var(--st-wip)}
.p-watch{grid-area:watch;--accent:var(--st-monitoring)}
.p-pile{grid-area:pile;--accent:var(--st-idle)}
.p-act{grid-area:act;--accent:var(--text-3)}
.p-notif{grid-area:notif;--accent:var(--st-review)}
.ph{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
.ph h2{font:600 12.5px var(--font-sans)}
.ph .n{font:500 11px var(--font-mono);color:var(--text-3)}
.pb{flex:1;min-height:0;overflow:auto;padding:8px 12px 10px}
.pfoot{flex:none;display:flex;align-items:center;gap:8px;min-height:30px;padding:0 12px;border-top:1px solid var(--line);font:11px var(--font-mono);color:var(--text-3)}
.empty{padding:8px 0;color:var(--text-3);font-size:12px}

/* small labels */
.kl{font:600 10px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--k,var(--text-2));white-space:nowrap}
.badge{--c:var(--text-3);display:inline-flex;align-items:center;flex:none;height:18px;padding:0 6px;border-radius:3px;font:500 10.5px/1 var(--font-mono);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.unread-dot{flex:none;display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--focus)}
.tlink{color:var(--text-2);min-width:0;text-align:left}
.tlink:hover{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.tlink.unread{color:var(--text);font-weight:600}
.tlink.unread::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--focus);vertical-align:1px}
.meta{font:11px var(--font-mono);color:var(--text-3)}

/* waiting cards */
.wcard{--c:var(--st-hitl);position:relative;margin-bottom:10px;padding:12px 14px 12px 16px;border:1px solid var(--line-strong);border-left:3px solid var(--c);border-radius:var(--radius);background:var(--panel-2)}
.wcard.unread{background:color-mix(in srgb,var(--focus) 7%,var(--panel-2))}
.wc-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.wc-title{margin-top:7px;font:600 15px/1.3 var(--font-sans);letter-spacing:-.005em}
.wc-q{margin-top:7px;padding-left:10px;border-left:1px solid var(--line-strong);color:var(--text-2);max-width:60ch}
.wc-foot{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}

/* running, watching, piles rows */
.row{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:500}
.row .t2{display:flex;align-items:center;gap:8px;min-width:0;font-size:11.5px;color:var(--text-3)}
.row .t2 .tlink{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2 span{white-space:nowrap}
.prov{flex:none;display:inline-grid;place-items:center;min-width:26px;height:18px;padding:0 4px;border:1px solid var(--line-strong);border-radius:3px;font:600 10px/1 var(--font-mono);color:var(--text-2)}
.elapsed{flex:none;font:500 12px var(--font-mono);color:var(--st-wip)}
.wrow{padding:9px 2px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wr-h{display:flex;align-items:center;gap:8px;min-width:0}
.wr-h .tlink{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mons{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mon{display:inline-flex;align-items:center;gap:6px;height:18px;padding:0 6px;border:1px solid var(--line-strong);border-radius:3px;font:10.5px var(--font-mono);color:var(--text-2)}
.mon i{font-style:normal;color:var(--text-3)}
.mon.confirmed{border-color:var(--st-monitoring);color:var(--text)}
.mon.confirmed i{color:var(--st-monitoring)}
.mon.suggested{border-style:dashed}
.wr-latest{margin-top:6px;font-size:11.5px;color:var(--text-2);min-width:0}
.wr-latest .meta{margin-right:6px}

/* piles */
.pg{--c:var(--st-idle);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.pg:last-child{border-bottom:0}
.pg-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pg-h h3{font:600 12px var(--font-sans);color:var(--c)}
.pg-h .n{margin-left:auto;font:500 14px var(--font-mono);color:var(--text)}
.pg li{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 0;font-size:12px}
.pg li .tlink{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg li .sub{flex:none;font:10.5px var(--font-mono);color:var(--text-3);white-space:nowrap}

/* activity feed and notifications */
.ev{--k:var(--k-axiom);display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:7px 6px;margin:0 -6px;border-bottom:1px solid var(--line);border-radius:3px}
.ev time{font:11px var(--font-mono);color:var(--text-3);padding-top:1px}
.ev.old{opacity:.6}
.ev .h{display:flex;align-items:center;gap:8px;min-width:0}
.ev .h .tlink{margin-left:auto;max-width:48%;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .txt{margin-top:2px;font-size:12px;color:var(--text-2)}
.ev.fresh{animation:freshGlow 4.5s ease-out 1}
@keyframes freshGlow{0%{background:color-mix(in srgb,var(--k) 22%,transparent);box-shadow:inset 2px 0 0 var(--k)}100%{background:transparent;box-shadow:inset 2px 0 0 transparent}}
.nt{padding:6px 0;border-bottom:1px solid var(--line)}
.nt .h{display:flex;align-items:center;gap:8px;min-width:0}
.nt .h .meta{white-space:nowrap}
.nt .txt{margin-top:2px;font-size:12px;color:var(--text-2)}
.nt{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center}
.nt .h,.nt .txt{grid-column:1}
.nt .acts{grid-column:2;grid-row:1 / span 2}

/* dossier */
.dossier{flex:1;min-height:0;display:flex;flex-direction:column}
.dh{flex:none;padding:12px 18px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.dh-top{display:flex;align-items:center;gap:10px}
.dh-title{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.dh h1{font:600 21px/1.2 var(--font-sans);letter-spacing:-.015em;outline:none}
.dh .slug{font:11.5px var(--font-mono);color:var(--text-3)}
.dh .note{margin-top:6px;font-size:13px}
.dh .goal{margin-top:2px;color:var(--text-2);font-size:12.5px}
.dmeta{display:flex;flex-wrap:wrap;gap:10px 30px;margin-top:12px}
.dmeta dt{font:500 10.5px var(--font-mono);color:var(--text-3);margin-bottom:3px}
.dmeta dd{font-size:12.5px;color:var(--text)}
.plist{display:flex;flex-direction:column;gap:3px}
.plist li{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px}
.pk{font:500 10px var(--font-mono);color:var(--text-3)}
.lock{display:inline-flex;color:var(--text-3)}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px)}
.col{min-height:0;overflow:auto;padding:14px 18px 24px}
.col.side{border-left:1px solid var(--line);background:var(--panel-2)}
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:600 12px var(--font-sans)}
.sec-h .n{font:500 11px var(--font-mono);color:var(--text-3)}
.sec-h .sp{flex:1}
.day{font:500 11px var(--font-mono);color:var(--text-3);margin:10px 0 6px 24px}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.te{position:relative;padding-bottom:14px}
.te::before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--k)}
.te-h{display:flex;align-items:center;gap:8px;min-width:0}
.te-h .who{font-size:11.5px;color:var(--text-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.te-h .tm{margin-left:auto;font:11px var(--font-mono);color:var(--text-3);flex:none}
.te-h .kl{color:var(--k)}
.te-b{margin-top:4px;max-width:68ch;color:var(--text)}
.te-x{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-top:6px}
.ref{font:500 10.5px var(--font-mono);color:var(--text-2);border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{font:11px var(--font-mono);color:var(--text-3)}
.kv span{color:var(--text-2)}
.thr{margin-bottom:8px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.thr.attached{border-color:var(--focus)}
.thr .h{display:flex;align-items:center;gap:8px;min-width:0}
.thr .h b{font-weight:500;min-width:0}
.thr .m{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:4px;font:11px var(--font-mono);color:var(--text-3)}
.picker{margin-top:8px;padding:8px;border:1px dashed var(--line-strong);border-radius:var(--radius)}
.picker li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.picker li:last-child{border-bottom:0}
.picker .main{flex:1;min-width:0}
.pm{font:10.5px var(--font-mono);color:var(--text-3)}
.lg{margin-bottom:10px}
.lg h3{font:500 11px var(--font-mono);color:var(--text-3);margin-bottom:3px}
.lg li{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.lg .lm{flex:1;min-width:0;text-align:right;font:11px var(--font-mono);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.mrow .mon{height:18px}

/* status bar */
.sbar{flex:none;height:26px;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font:11px var(--font-mono);color:var(--text-3);white-space:nowrap}
.sbl{display:flex;gap:18px;min-width:0;overflow:hidden}
.sbl b{font-weight:500;color:var(--text-2)}

/* settings dialog */
dialog{padding:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--text);width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.dlg{display:flex;flex-direction:column}
.dlg-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg-h h2{flex:1;font:600 14px var(--font-sans)}
#dlgBody{display:flex;flex-direction:column;padding:4px 14px 14px}
.fs{min-width:0;margin:0;padding:12px 0 0;border:0;border-top:1px solid var(--line)}
.fs:first-child{border-top:0}
.fs legend{margin-bottom:6px;padding:0;font:500 11px var(--font-mono);color:var(--text-3)}
.fs p{font-size:12.5px}
.ck{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.ck input[type="checkbox"]{accent-color:var(--focus);margin:0}
.num{width:64px;height:26px;margin:0 6px;padding:0 6px;background:var(--panel-2);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius);font:inherit}
.dlg-muted li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Axiom</div>
    <button class="btn ghost" type="button" data-home>Dashboard</button>
    <span class="crumb" id="crumb"></span>
    <span class="sp"></span>
    <div class="counts" id="counts"></div>
    <button class="btn" type="button" data-settings>Notification settings</button>
    <button class="btn" type="button" id="btnTheme" data-theme-toggle>Light theme</button>
  </header>

  <div class="health" id="health" role="list" aria-label="Provider health"></div>

  <main class="home" id="home">
    <section class="panel p-wait" aria-labelledby="hWait">
      <div class="ph"><h2 id="hWait">Waiting for you</h2><span class="n" id="nWait"></span></div>
      <div class="pb" id="wait"></div>
    </section>
    <section class="panel p-run" aria-labelledby="hRun">
      <div class="ph"><h2 id="hRun">Running now</h2><span class="n" id="nRun"></span></div>
      <div class="pb" id="run"></div>
    </section>
    <section class="panel p-watch" aria-labelledby="hWatch">
      <div class="ph"><h2 id="hWatch">Watching</h2><span class="n" id="nWatch"></span></div>
      <div class="pb" id="watch"></div>
    </section>
    <section class="panel p-pile" aria-labelledby="hPile">
      <div class="ph"><h2 id="hPile">Piles</h2></div>
      <div class="pb" id="pile"></div>
    </section>
    <section class="panel p-act" aria-labelledby="hAct">
      <div class="ph"><h2 id="hAct">Activity</h2><span class="n">newest first</span></div>
      <div class="pb" id="act"></div>
    </section>
    <section class="panel p-notif" aria-labelledby="hNotif">
      <div class="ph"><h2 id="hNotif">Notifications</h2><span class="n" id="nNotif"></span><span class="sp"></span><button class="btn sm ghost" type="button" data-settings>Settings</button></div>
      <div class="pb" id="notif"></div>
      <div class="pfoot" id="notifFoot"></div>
    </section>
  </main>

  <div class="dossier" id="dossier" hidden>
    <header class="dh" id="dh"></header>
    <div class="dbody">
      <section class="col" id="tlCol" aria-label="History"></section>
      <aside class="col side" id="side" aria-label="Threads, links and monitoring"></aside>
    </div>
  </div>

  <footer class="sbar">
    <div class="sbl" id="sbL"></div>
    <span class="sp"></span>
    <span class="mono" id="sbR"></span>
  </footer>

  <dialog id="settings" aria-labelledby="sTitle">
    <form method="dialog" class="dlg">
      <header class="dlg-h">
        <h2 id="sTitle">Notification settings</h2>
        <button class="btn sm ghost" type="submit" value="close">Close</button>
      </header>
      <div id="dlgBody"></div>
    </form>
  </dialog>
</div>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var A = window.AXIOM;
  var doc = document, root = doc.documentElement;
  var T0 = Date.now(), BASE = Date.parse(A.now);
  var MIN = 60000, HOUR = 3600000, DAY = 86400000;
  var LOCK = '<svg class="lock" width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="none" stroke="currentColor"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor"/></svg>';
  var BACK = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';

  function $(sel) { return doc.querySelector(sel); }
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function now() { return BASE + (Date.now() - T0); }
  function ms(s) { return Date.parse(s); }
  function hhmm(s) { return s.slice(11, 16); }
  function p2(n) { return String(n).padStart(2, "0"); }
  function rel(s) {
    var d = now() - ms(s);
    if (d < MIN) return "just now";
    if (d < HOUR) return Math.floor(d / MIN) + " min ago";
    if (d < DAY) return Math.floor(d / HOUR) + " h ago";
    var n = Math.floor(d / DAY);
    return n + (n === 1 ? " day ago" : " days ago");
  }
  function dayLabel(s) {
    var yest = new Date(BASE - DAY);
    var yKey = yest.getFullYear() + "-" + p2(yest.getMonth() + 1) + "-" + p2(yest.getDate());
    var d = new Date(ms(s)).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    if (s.slice(0, 10) === A.now.slice(0, 10)) return "Today, " + d;
    if (s.slice(0, 10) === yKey) return "Yesterday, " + d;
    return d;
  }
  function fmtElapsed(ms2) {
    var s = Math.max(0, Math.floor(ms2 / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;

  // ---- data indexes -------------------------------------------------------
  var TOPICS = A.topics, BY = {}, TICKET = {}, EPIC = {};

  A.tickets.forEach(function (x) { TICKET[x.slug] = x; });
  A.epics.forEach(function (x) { EPIC[x.slug] = x; });

  var KCOL = { "note": "k-note", "decision": "k-decision", "finding": "k-finding", "verification": "k-verification",

  function kcol(kind) { return "var(--" + (KCOL[kind] || "k-axiom") + ")"; }
  function kindLabel(e) {
    var base = (A.entryKinds[e.kind] || {}).label || e.kind.toUpperCase();
    if (e.author === "owner") return /^YOU\b/.test(base) ? base : "YOU " + base;

    if (e.body) return e.body;

  }

                    "error": "--st-error", "pr review": "--st-review", "stale prompt": "--st-stale", "jira changed": "--st-monitoring" };

  // ---- mutable mock state (in-memory only) -------------------------------
  var S = {
    open: root.dataset.open || "",
    unread: {}, muted: {}, mutedKinds: {}, staleDismissed: {}, dismissedN: {},
    over: {}, added: {}, attached: {}, mon: {},
    staleDays: A.notificationSettings.staleAfterDays,
    picker: false, freshShown: false
  };
  TOPICS.forEach(function (x) {
    if (x.unread) S.unread[x.slug] = true;
    if (x.muted || A.notificationSettings.mutedTopics.indexOf(x.slug) >= 0) S.muted[x.slug] = true;
    if (x.staleDismissed) S.staleDismissed[x.slug] = true;
  });
  A.notificationSettings.mutedKinds.forEach(function (k) { S.mutedKinds[k] = true; });

  function statusOf(x) { return Object.prototype.hasOwnProperty.call(S.over, x.slug) ? S.over[x.slug] : x.status; }
  function threadsOf(x) { return x.threads.concat(S.added[x.slug] || []); }
  function inView(x, list) {
    var s = statusOf(x);
    if (s === null) return threadsOf(x).some(function (th) { return !th.endedAt && list.indexOf(th.status) >= 0; });
    return list.indexOf(s) >= 0;
  }
  function idleDays(x) { return Math.floor((now() - ms(x.lastWorkedAt)) / DAY); }
  function isStalePrompt(x) { return statusOf(x) === "idle" && idleDays(x) >= S.staleDays && !S.staleDismissed[x.slug]; }
  function byLast(a, b) { return ms(b.lastWorkedAt) - ms(a.lastWorkedAt); }
  function unreadCount() { return Object.keys(S.unread).filter(function (k) { return S.unread[k]; }).length; }
  function notifVisible(n) { return !S.dismissedN[n.id] && !S.muted[n.topic] && !S.mutedKinds[n.kind]; }
  function notifHidden(n) { return !S.dismissedN[n.id] && !notifVisible(n); }
  function monState(x, i) {
    var key = x.slug + "#" + i;
    return S.mon[key] || x.monitors[i].state;
  }
  function attentionTopics() { return TOPICS.filter(function (x) { return inView(x, ["hitl", "error"]); }); }
  function stalePromptTopics() { return TOPICS.filter(isStalePrompt); }
  function runningThreads() {
    var out = [];
    TOPICS.forEach(function (x) {
      threadsOf(x).forEach(function (th) { if (th.status === "wip") out.push({ x: x, th: th }); });
    });
    return out.sort(function (a, b) { return ms(a.th.startedAt) - ms(b.th.startedAt); });

  function scope() { return S.open && BY[S.open] ? "#dossier " : "#home "; }

  }
  function tl(x, extra) {

  }

  function provName(p) { return p === "t3" ? "T3" : "Claude Code"; }
  function monChip(x, i) {
    var st = monState(x, i), m = x.monitors[i];

  }

  // ---- home: top, health, status bar ------------------------------------
  function renderTop() {
    var nWait = attentionTopics().length + stalePromptTopics().length;

  // ---- home: panels -----------------------------------------------------
  function renderWait() {
    var attn = attentionTopics().sort(byLast);
    var html = attn.map(function (x) {
      var isErr = statusOf(x) === "error" || (x.attention && x.attention.reason === "error");
      var col = isErr ? "var(--st-error)" : "var(--st-hitl)";

        '<div class="wc-top">' + badge(statusOf(x)) +
          '<span class="kl" style="--k:' + col + '">' + esc(reason.toUpperCase()) + '</span>' +
          (S.unread[x.slug] ? '<span class="unread-dot" title="Unread"></span><span class="sr">Unread</span>' : "") +
          '<span class="sp"></span><span data-rel="' + x.lastWorkedAt + '">' + rel(x.lastWorkedAt) + '</span></div>' +
        '<h3 class="wc-title">' + esc(x.title) + '</h3>' +
        '<p class="wc-q">' + esc(text) + '</p>' +
        '<div class="wc-foot"><span class="meta">' + threadsOf(x).length + ' thread' + (threadsOf(x).length === 1 ? "" : "s") + '</span><span class="sp"></span>' +
          '<button class="btn primary sm" type="button" data-open="' + esc(x.slug) + '">Open</button>' +
          '<button class="btn sm" type="button" aria-pressed="' + (!!S.muted[x.slug]) + '" data-mute="' + esc(x.slug) + '">' + (S.muted[x.slug] ? "Muted" : "Mute topic") + '</button>' +
        '</div></article>';

    var stale = stalePromptTopics().map(function (x) {

        '<h3 class="wc-title">' + esc(x.title) + '</h3>' +

  function renderRun() {

  // ---- dossier -----------------------------------------------------------
  function jiraOrStatus(o) {

      '<section class="sec" aria-labelledby="hLinks"><div class="sec-h"><h2 id="hLinks">Links</h2></div>' + linksHTML + '</section>' +
      '<section class="sec" aria-labelledby="hMon"><div class="sec-h"><h2 id="hMon">Monitoring targets</h2><span class="n">' + x.monitors.length + '</span></div>' +
        (monHTML ? "<ul>" + monHTML + "</ul>" : '<p class="empty">None yet. Axiom suggests targets from links, such as an open PR.</p>') + '</section>';
  }

  // ---- settings dialog ----------------------------------------------------
  function mutedListHTML() {
    var keys = Object.keys(S.muted).filter(function (k) { return S.muted[k]; });
    if (!keys.length) return '<p class="empty">No muted topics.</p>';
    return '<ul class="dlg-muted">' + keys.map(function (k) {
      return '<li><span class="trunc" style="flex:1">' + esc(BY[k].title) + '</span>' +
        '<button class="btn sm" type="button" data-unmute="' + esc(k) + '">Unmute</button></li>';
    }).join("") + "</ul>";
  }
  function renderSettings() {
    $("#dlgBody").innerHTML =
      '<fieldset class="fs"><legend>Notification kinds</legend>' + A.notificationSettings.kinds.map(function (k) {
        return '<label class="ck"><input type="checkbox" data-kind="' + esc(k) + '"' + (S.mutedKinds[k] ? "" : " checked") + '>' + esc(k) + '</label>';
      }).join("") + "</fieldset>" +
      '<fieldset class="fs"><legend>Muted topics</legend><div id="dlgMuted">' + mutedListHTML() + "</div></fieldset>" +
      '<fieldset class="fs"><legend>Stale prompt</legend><label class="ck">Ask me to mark a topic stale after' +
        '<input class="num" id="staleDays" type="number" min="1" max="365" value="' + S.staleDays + '">days idle</label></fieldset>' +
      '<fieldset class="fs"><legend>Browser notifications</legend><p>Permission: <span class="mono">' +
        esc(A.notificationSettings.browserNotifications) + "</span></p></fieldset>";
  }

  // ---- clock, render, events ----------------------------------------------
  function tick() {
    var n = now();
    doc.querySelectorAll("[data-started]").forEach(function (el) { el.textContent = fmtElapsed(n - ms(el.dataset.started)); });
    doc.querySelectorAll("[data-rel]").forEach(function (el) { el.textContent = rel(el.dataset.rel); });
    var d = new Date(n);
    $("#sbR").textContent = p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  }
  function render(focusSel) {
    var topic = S.open ? BY[S.open] : null;
    $("#home").hidden = !!topic;
    $("#dossier").hidden = !topic;
    if (topic) renderDossier(topic); else renderHome();
    renderTop(); renderHealth(); renderStatus();
    tick();
    if (focusSel) {
      var n = doc.querySelector(focusSel);
      if (n) n.focus({ preventScroll: true });
    }
  }

  doc.addEventListener("click", function (e) {
    var el = e.target.closest("button");
    if (!el) return;
    var d = el.dataset, fs = null;
    if (el.hasAttribute("data-settings")) { renderSettings(); $("#settings").showModal(); return; }
    if (el.hasAttribute("data-theme-toggle")) {
      root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
      fs = "#btnTheme";
    } else if (d.unmute !== undefined) {
      delete S.muted[d.unmute];
      $("#dlgMuted").innerHTML = mutedListHTML();
      $("#staleDays").focus();
      renderTop(); renderNotifs(); renderWait(); renderStatus();
      return;
    } else if (el.hasAttribute("data-home")) {
      S.open = ""; fs = "[data-home]";
    } else if (d.open !== undefined) {
      S.open = d.open; delete S.unread[d.open]; fs = "#dtitle";
    } else if (d.mute !== undefined) {
      if (S.muted[d.mute]) delete S.muted[d.mute]; else S.muted[d.mute] = true;
      fs = scope() + '[data-mute="' + d.mute + '"]';
    } else if (d.dismissN !== undefined) {
      S.dismissedN[d.dismissN] = true; fs = "#notif [data-dismiss-n]";
    } else if (d.staleMark !== undefined) {
      S.over[d.staleMark] = "stale"; fs = "#wait button";
    } else if (d.staleDismiss !== undefined) {
      S.staleDismissed[d.staleDismiss] = true; fs = "#wait button";
    } else if (d.confirm !== undefined) {
      S.mon[d.confirm] = "confirmed"; fs = "#side .mrow button";
    } else if (d.picker !== undefined) {
      S.picker = !S.picker; fs = "#side [data-picker]";
    } else if (d.attach !== undefined) {
      var q = A.t3Unattached.filter(function (t3) { return t3.id === d.attach; })[0];
      if (q && S.open) {
        S.attached[q.id] = true;
        (S.added[S.open] = S.added[S.open] || []).push({ provider: "t3", id: q.id, title: q.title, status: null, env: q.env, t3State: q.status, added: true });
      }
      S.picker = false; fs = "#side [data-picker]";
    } else {
      return;
    }
    render(fs);
  });

  $("#settings").addEventListener("change", function (e) {
    var t2 = e.target;
    if (t2.dataset && t2.dataset.kind) { S.mutedKinds[t2.dataset.kind] = !t2.checked; render(); }
    else if (t2.id === "staleDays") {
      var v = parseInt(t2.value, 10);
      if (v >= 1) { S.staleDays = v; render(); }
    }
  });

  if (S.open && BY[S.open]) delete S.unread[S.open];
  render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
