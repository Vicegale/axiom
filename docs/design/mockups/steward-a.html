  /* topic statuses */

[data-theme="light"] {

  --focus: #2f5fd0;

  --st-review: #5b55e0; --st-done: #23914a; --st-stale: #8a7556; --st-error: #d93636;
  --k-note: #6b7380; --k-decision: #b87400; --k-finding: #d1601a; --k-verification: #1d9a5f; --k-owner: #d43c72;

<style>
/* Shared pieces of the Steward view mockups. Colours and type come from tokens.css. */
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
:root { --meta: color-mix(in srgb, var(--text-2) 55%, var(--text-3)); --steward: #e0a84f; }
[data-theme="light"] { --steward: #a8701a; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
code { font: 12px var(--font-mono); color: var(--text-2); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.meta { color: var(--meta); font-size: 12px; font-weight: 400; }
.num { font-variant-numeric: tabular-nums; }

/* status colours */
.s-idle { --c: var(--st-idle); } .s-wip { --c: var(--st-wip); } .s-hitl { --c: var(--st-hitl); }
.s-monitoring { --c: var(--st-monitoring); } .s-blocked { --c: var(--st-blocked); } .s-review { --c: var(--st-review); }
.s-done { --c: var(--st-done); } .s-stale { --c: var(--st-stale); } .s-error { --c: var(--st-error); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.pill { display: inline-flex; align-items: center; padding: 0 6px; height: 18px; border-radius: 4px; font: 11px var(--font-mono);
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }

/* top bar: same shape as the live Desk */
.top { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; text-decoration: none; }
.brand svg { color: var(--focus); }
.page-switch { display: flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.page-switch a { padding: 3px 10px; border-radius: 5px; text-decoration: none; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
.page-switch a[aria-current] { background: var(--raised); color: var(--text); }
.count { font: 10px/16px var(--font-mono); min-width: 16px; text-align: center; padding: 0 4px; border-radius: 8px; background: var(--steward); color: #111; }
.top .grow { flex: 1; }
.st-toggle { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px 0 7px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; }
.st-toggle .sw { width: 22px; height: 12px; border-radius: 6px; background: var(--line-strong); position: relative; flex: none; }
.st-toggle .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.st-toggle.on { border-color: color-mix(in srgb, var(--steward) 50%, transparent); }
.st-toggle.on .sw { background: color-mix(in srgb, var(--steward) 40%, transparent); }
.st-toggle.on .sw::after { left: 12px; background: var(--steward); }

/* buttons */
.btn { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel-2); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn-primary:hover { background: var(--text-2); border-color: var(--text-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--raised); }
.btn-sm { height: 24px; padding: 0 8px; font-size: 12px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; text-decoration: none; }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.bar-btn { border-color: var(--line); }
.bar-btn[aria-expanded="true"] { background: var(--raised); color: var(--text); }
/* revealed on hover or keyboard focus within the item; always shown on touch screens */
.reveal { opacity: 0; transition: opacity .12s; }
.item:hover .reveal, .item:focus-within .reveal, .mem:hover .reveal, .mem:focus-within .reveal { opacity: 1; }
@media (hover: none) { .reveal { opacity: 1; } }

/* panels and section heads */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.sec-h { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; }
.sec-h h2 { font-size: 13px; font-weight: 600; }
.sec-h .n { color: var(--meta); font: 12px var(--font-mono); }
.sec-h .end { margin-left: auto; }

/* list items: one shape for questions, findings and suggestions */
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
.item-main { display: grid; gap: 4px; min-width: 0; }
.item-acts { display: flex; gap: 4px; align-items: flex-start; }
.item-title { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-text { font-size: 13.5px; }
.item-text.dim { color: var(--text-2); font-size: 13px; }
.meta-line { display: flex; align-items: center; flex-wrap: wrap; gap: 0 6px; font-size: 12px; color: var(--meta); }
.meta-line .sep { opacity: .6; }
.tlink { color: var(--text-2); text-decoration: none; }
.tlink:hover { color: var(--text); text-decoration: underline; }
.kind { color: var(--steward); }
.kind-blind-spot { color: var(--k-authorization); }
.lv-urgent { box-shadow: inset 3px 0 0 var(--st-error); }
.lv-attention { box-shadow: inset 3px 0 0 var(--st-hitl); }
.lvl { font: 10px/16px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 0 5px; border-radius: 3px; color: var(--st-error); background: color-mix(in srgb, var(--st-error) 14%, transparent); }
.answer { display: flex; gap: 6px; margin-top: 4px; }
.answer input { flex: 1; min-width: 0; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--focus); background: var(--bg); outline: none; }

/* prepared fix inside a finding; something Steward did */
.fix { margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 6px; background: var(--panel-2); }
.fix-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fix-acts { display: flex; gap: 4px; margin-top: 2px; }
.br { color: var(--steward); }
.did { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.did details { flex-basis: 100%; font-size: 12px; }
.did summary { cursor: pointer; color: var(--meta); width: max-content; }
.diff { margin: 2px 0 0; padding: 8px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font: 12px/1.5 var(--font-mono); overflow-x: auto; }
.d-add { color: var(--st-done); } .d-del { color: var(--st-error); } .d-ctx { color: var(--text-3); }

/* memory */
.meter { height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--steward); }
.core-meter { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.mem-list { display: grid; }
.mem { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); }
.mem:first-child { border-top: 0; }
.mem > span { flex: 1; }
.btn-edit { height: 20px; font-size: 12px; }
.mem-group + .mem-group { margin-top: 8px; }
.mem-group-h { font-size: 12px; color: var(--text-2); font-weight: 500; display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
.mem-to { font: 10px var(--font-mono); text-transform: uppercase; color: var(--meta); }
.index { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.index a { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--raised); color: var(--text-2); text-decoration: none; }
.index a:hover { color: var(--text); }

/* usage: one row per model */
.usage { display: grid; grid-template-columns: max-content 1fr max-content; gap: 8px 10px; align-items: center; }

/* chat */
.msg { display: grid; gap: 4px; max-width: 88%; }
.msg-owner { justify-self: end; }
.msg-b { padding: 7px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.msg-owner .msg-b { background: var(--raised); border-color: transparent; }
.noted { font-size: 12px; color: var(--text-2); display: flex; gap: 6px; align-items: baseline; }
.noted-l { font: 10px var(--font-mono); text-transform: uppercase; color: var(--steward); }
.acting { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.composer { display: flex; align-items: flex-end; gap: 6px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel-2); padding: 5px 5px 5px 11px; }
.composer:focus-within { border-color: var(--focus); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; padding: 4px 0; line-height: 20px; max-height: 160px; }
.composer .model { height: 26px; padding: 0 8px; border-radius: 13px; border: 1px solid var(--line); background: transparent; color: var(--text-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
.composer .send { background: var(--text); color: var(--bg); min-width: 26px; height: 26px; border-radius: 13px; }

/* stages of a wake */
.stages { display: grid; grid-template-columns: max-content max-content 1fr max-content; gap: 4px 12px; font-size: 12px; align-items: baseline; }
.stages .m { font: 11px var(--font-mono); color: var(--text-2); }
.blind { color: var(--k-authorization); }

/* settings tables */
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 6px 14px; border-top: 1px solid var(--line); }
table.t th { font-weight: 500; color: var(--meta); font-size: 12px; }
select { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 6px; height: 26px; padding: 0 6px; }

/* Steward's icon (Facet, 2026-11-25) */
.st-ic { display: inline-flex; color: var(--steward); }
.st-toggle .st-ic { margin-left: 1px; margin-right: -2px; }

</style>
<style>
/* A: inbox. A rail of sections, the selected one in the middle; the chat docks on the right only while open. */
body { height: 100vh; display: grid; grid-template-rows: 44px 1fr; overflow: hidden; }
.shell { display: grid; grid-template-columns: 188px minmax(0, 1fr); min-height: 0; }
.shell.chat-open { grid-template-columns: 188px minmax(0, 1fr) 360px; }
.rail { border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; overflow: auto; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; text-decoration: none; color: var(--text-2); }
.rail a:hover { background: var(--panel); color: var(--text); }
.rail a[aria-current] { background: var(--raised); color: var(--text); }

main { overflow: auto; min-height: 0; scrollbar-gutter: stable; }
.col { max-width: 960px; padding: 16px 24px 32px; display: grid; gap: 14px; }
.col > h1 { font-size: 16px; font-weight: 600; }

.chat { border-left: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; min-height: 0; background: var(--panel); }
.chat-h { padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
.chat-h h2 { font-size: 13px; font-weight: 600; flex: 1; }
.chat-log { overflow: auto; padding: 14px; display: grid; gap: 10px; align-content: start; }

</style>
</head>

  },
  chat: [
    { who: "owner", text: "Why did you rebase row-60-ward?" },
    { who: "steward", text: "main changed src/rules/ward.ts and mtg#219 touches the same file, so a conflict was coming while the PR is in review. The rebase was clean and nobody else had pushed, so I did it in place and saved the old tip. I didn't push." },
    { who: "owner", text: "Ok. Don't rebase atlas branches, that repo merges main instead." },
    { who: "steward", text: "Understood: for atlas I'll only report.", noted: "atlas merges main; never rebase its branches → repo atlas" },
    { who: "owner", text: "Check atlas-coolify-deployment now." },
    { who: "steward", text: "Checking it now.", acting: true },
  ],
};
const SUG = Object.fromEntries(STEWARD.suggestions.map((s) => [s.id, s]));
const ATTACHED_FIXES = new Set(STEWARD.findings.filter((f) => f.fix).map((f) => f.fix));

/* ---------- shared renderers ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = {
  steward: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z"/><path d="M8 1.5v13L1.5 8z" fill="currentColor"/></svg>`,
  stewardOff: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z"/><path d="M8 1.5v13L1.5 8z" fill="currentColor" opacity=".45"/><path d="M2 14 14 2" stroke-linecap="round"/></svg>`,
  x: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>`,
  gear: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="var(--bg)"/><circle cx="10.5" cy="8" r="1.6" fill="var(--bg)"/><circle cx="7" cy="12" r="1.6" fill="var(--bg)"/></svg>`,
  chat: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>`,
  send: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>`,
  theme: `<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>`,
  off: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z"/><path d="M2.5 13.5l11-11"/></svg>`,
  diamond: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z"/></svg>`,
};
const R = {
  topic(slug, title) { return slug ? `<a class="tlink" href="#topic/${slug}">${esc(title || slug)}</a>` : ""; },
  metaLine(parts) { return `<p class="meta-line">${parts.filter(Boolean).join('<span class="sep">·</span>')}</p>`; },
  dismiss(label = "Dismiss") { return `<button class="icon-btn reveal" aria-label="${label}" title="${label}">${ICON.x}</button>`; },

  /* question: text first; Answer opens a field on demand */
  question(q, o = {}) {
    return `<article class="item q">
      <div class="item-main">
        <p class="item-text">${esc(q.text)}</p>
        ${R.metaLine([`<span class="kind kind-${q.kind.replace(" ", "-")}">${q.kind}</span>`, R.topic(q.topic, q.topicTitle), esc(q.source), o.noTime ? "" : q.at])}
        <form class="answer" hidden onsubmit="return false"><input aria-label="Your answer" placeholder="Your answer"><button class="btn btn-primary btn-sm" type="submit">Send</button><button class="btn btn-ghost btn-sm" type="button" data-cancel>Cancel</button></form>
      </div>
      <div class="item-acts"><button class="btn btn-sm" data-answer>Answer</button>${R.dismiss()}</div>
    </article>`;
  },

  fix(s, open) {
    return `<div class="fix">
      <div class="fix-h"><code class="br">${s.branch}</code><span class="meta">${esc(s.meta)}</span></div>
      ${R.diff(s, open)}
      <div class="fix-acts"><button class="btn btn-primary btn-sm" title="Applies it to your branch locally. Pushing stays yours.">Adopt</button><button class="btn btn-sm" data-diff aria-expanded="${!!open}">Diff</button><button class="btn btn-ghost btn-sm">Discard</button></div>
    </div>`;
  },
  diff(s, open) { return `<pre class="diff" ${open ? "" : "hidden"}>${s.patch.map(([k, l]) => `<span class="d-${k}">${esc(l)}</span>`).join("\n")}</pre>`; },

  /* finding: title + cause; a prepared fix, an action Steward took, or a status change sit inside it */
  finding(f, o = {}) {
    let inner = "";
    if (f.fix) inner = R.fix(SUG[f.fix], o.diffOpen);
    if (f.did) inner = `<div class="did"><span>${esc(f.did.what)}</span><button class="btn btn-ghost btn-sm">Undo</button><details><summary>Details</summary><code>${esc(f.did.details)}</code></details></div>`;
    if (f.changed) inner = `<div class="did"><span class="pill s-${f.changed.from}">${f.changed.from}</span>→<span class="pill s-${f.changed.to}">${f.changed.to}</span><span class="meta">by Steward</span><button class="btn btn-ghost btn-sm">Undo</button></div>`;
    const lvl = f.level === "urgent" ? `<span class="lvl">Urgent</span>` : "";
    return `<article class="item f lv-${f.level}">
      <div class="item-main">
        <p class="item-title">${lvl}${esc(f.title)}</p>
        <p class="item-text dim">${esc(f.text)}</p>
        ${inner}
        ${R.metaLine([R.topic(f.topic, f.topicTitle), o.noTime ? "" : f.at, f.notified ? "desktop notified" : ""])}
      </div>
      <div class="item-acts">${R.dismiss()}</div>
    </article>`;
  },

  suggestion(s, o = {}) {
    return `<article class="item sg">
      <div class="item-main">
        <p class="item-title">${esc(s.title)}</p>
        ${R.metaLine([`<code class="br">${s.branch}</code>`, esc(s.meta), R.topic(s.topic, s.topicTitle), o.noTime ? "" : s.at])}
        ${R.diff(s, o.diffOpen)}
        <div class="fix-acts"><button class="btn btn-primary btn-sm" title="Applies it to your branch locally. Pushing stays yours.">Adopt</button><button class="btn btn-sm" data-diff aria-expanded="${!!o.diffOpen}">Diff</button></div>
      </div>
      <div class="item-acts"><button class="icon-btn reveal" aria-label="Discard" title="Discard">${ICON.x}</button></div>
    </article>`;
  },

  coreMeter(c) {
    const pct = Math.round((c.used / c.budget) * 100);
    return `<div class="core-meter" title="Loaded into every wake and chat"><div class="meter"><span style="width:${pct}%"></span></div><span class="meta">${(c.used / 1000).toFixed(1)}k / ${c.budget / 1000}k</span></div>`;
  },
  memList(items) { return `<ul class="mem-list">${items.map((t) => `<li class="mem"><span>${esc(t)}</span><button class="icon-btn reveal btn-edit" aria-label="Edit">Edit</button></li>`).join("")}</ul>`; },
  memIndex(c) { return `<div class="index"><span class="meta">Also knows about</span>${c.index.map(([n, k]) => `<a href="#mem/${n}">${n} <span class="meta">${k}</span></a>`).join("")}</div>`; },
  attached(groups) { return groups.map((g) => `<div class="mem-group"><p class="mem-group-h"><span class="mem-to">${g.to}</span>${g.name}</p>${R.memList(g.items)}</div>`).join(""); },

  usage(list) {
    return `<div class="usage">${list.map((u) => {
      const pct = u.cap ? Math.max(1, Math.round((u.used / u.cap) * 100)) : 0;
      return `<span>${u.model}</span><div class="meter"><span style="width:${pct}%"></span></div><span class="meta num">${u.used}M / ${u.cap}M</span>`;
    }).join("")}</div>`;
  },

  chatMsg(m) {
    const noted = m.noted ? `<p class="noted"><span class="noted-l">Noted</span>${esc(m.noted)}</p>` : "";
    const acting = m.acting ? `<p class="acting"><span class="dot s-wip"></span>running</p>` : "";
    return `<div class="msg msg-${m.who}"><div class="msg-b">${esc(m.text)}</div>${noted}${acting}</div>`;
  },
  composer() {
    return `<form class="composer" onsubmit="return false"><textarea rows="1" aria-label="Message Steward" placeholder="Ask Steward or tell it to do something"></textarea><button class="model" type="button" title="Model for this chat">Sonnet 5.5 · medium</button><button class="icon-btn send" type="submit" aria-label="Send">${ICON.send}</button></form>`;
  },

  needsCount() { return STEWARD.questions.length + STEWARD.findings.filter((f) => f.level !== "info").length + STEWARD.suggestions.filter((s) => !ATTACHED_FIXES.has(s.id)).length; },
  topBar({ page = "steward", chat = false, settings = true } = {}) {
    const n = R.needsCount();
    return `<a class="brand" href="#">${ICON.diamond}<span>${page === "desk" ? "Desk" : "Steward"}</span></a>
      <nav class="page-switch" aria-label="Pages"><a href="#">Tracker</a><a href="#" ${page === "desk" ? 'aria-current="page"' : ""}>Desk</a><a href="#" ${page === "steward" ? 'aria-current="page"' : ""}><span class="st-ic">${ICON.steward}</span>Steward<span class="count" aria-label="${n} need you">${n}</span></a></nav>
      <span class="grow"></span>
      <button class="st-toggle on" aria-pressed="true" title="Last wake ${STEWARD.lastWake.at} · off stops new wakes; a running wake finishes"><span class="sw"></span><span class="st-ic">${ICON.steward}</span>Steward<span class="meta">next ${STEWARD.nextWake}</span></button>
      ${chat ? `<button class="icon-btn bar-btn" data-chat aria-label="Chat with Steward" title="Chat with Steward (c)">${ICON.chat}<span>Chat</span></button>` : ""}
      ${settings ? `<a class="icon-btn" href="#settings" aria-label="Steward settings" title="Steward settings">${ICON.gear}</a>` : ""}
      <button class="icon-btn" aria-label="Toggle theme" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">${ICON.theme}</button>`;
  },
};

/* ---------- shared behaviour ---------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-answer]");
  if (a) { const it = a.closest(".item"); it.querySelector(".answer").hidden = false; a.hidden = true; it.querySelector(".answer input").focus(); return; }
  const c = e.target.closest("[data-cancel]");
  if (c) { const it = c.closest(".item"); it.querySelector(".answer").hidden = true; it.querySelector("[data-answer]").hidden = false; return; }
  const d = e.target.closest("[data-diff]");
  if (d) { const host = d.closest(".fix") || d.closest(".item"); const pre = host.querySelector(".diff"); pre.hidden = !pre.hidden; d.setAttribute("aria-expanded", String(!pre.hidden)); }
});
document.addEventListener("input", (e) => { if (e.target.matches(".composer textarea")) { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px"; } });

</script>
<script>
const S = STEWARD;
document.getElementById("top").innerHTML = R.topBar({ chat: true, settings: false });
const needF = S.findings.filter((f) => f.level !== "info");
const loose = S.suggestions.filter((s) => !ATTACHED_FIXES.has(s.id));
const sections = [
  ["needs", "Needs you", R.needsCount()], ["questions", "Questions", S.questions.length], ["findings", "Findings", needF.length], ["suggestions", "Suggestions", S.suggestions.length],
  "hr", ["memory", "Memory"], ["wakes", "Wakes"], ["usage", "Token use"], ["settings", "Settings"],
];
const panel = (title, n, body, end = "") => `<section class="panel"><div class="sec-h"><h2>${title}</h2>${n !== "" ? `<span class="n">${n}</span>` : ""}${end ? `<span class="end">${end}</span>` : ""}</div>${body}</section>`;
const views = {
  needs: () => `<h1>Needs you</h1>
    ${panel("Findings", needF.length, needF.map((f) => R.finding(f)).join(""))}
    ${panel("Questions", S.questions.length, S.questions.map((q) => R.question(q)).join(""))}
    ${panel("Suggestions", loose.length, loose.map((s) => R.suggestion(s)).join(""))}`,
  questions: () => `<h1>Questions</h1>${panel("Open", S.questions.length, S.questions.map((q) => R.question(q)).join(""))}`,
  findings: () => {
    const by = {};
    S.findings.forEach((f) => (by[f.topicTitle] ||= []).push(f));
    return `<h1>Findings</h1>` + Object.entries(by).map(([t, fs]) => panel(t, fs.length, fs.map((f) => R.finding(f)).join(""))).join("");
  },
  suggestions: () => `<h1>Suggestions</h1>${panel("Open", S.suggestions.length, S.suggestions.map((s) => R.suggestion(s)).join(""))}`,
  memory: () => `<h1>Memory</h1>
    ${panel("Core", "", `<div class="pad">${R.coreMeter(S.memory.core)}${R.memList(S.memory.core.facts)}${R.memIndex(S.memory.core)}</div>`, `<span class="meta">tidied ${S.memory.core.rewritten}</span>`)}
    ${panel("Attached", "", `<div class="pad">${R.attached(S.memory.attached)}</div>`, `<span class="meta">loaded when the topic, repo or person comes up</span>`)}
    ${panel("General", "", `<div class="pad">${R.memList(S.memory.general)}</div>`, `<button class="btn btn-sm">Add</button>`)}`,
  wakes: () => `<h1>Wakes</h1>
    ${panel(`Last wake · ${S.lastWake.at}`, "", `<div class="pad"><div class="stages">${S.lastWake.stages.map((s) => `<span>${s.n} ${s.name}</span><span class="m">${s.model} ${s.effort}</span><span class="meta">${s.did}</span><span class="meta num">${s.tokens}</span>`).join("")}</div>
      ${S.lastWake.blindSpots.map((b) => `<p class="meta"><span class="blind">Blind spot</span> · ${b}</p>`).join("")}</div>`, `<span class="meta">${S.lastWake.trigger} · ${S.lastWake.took}</span>`)}
    ${panel("Earlier", "", S.wakes.slice(1).map((w) => `<div class="wk"><span class="num">${w.at}</span><span>${w.trigger} <span class="meta">· ${w.summary}</span></span><span class="meta num">${w.tokens}</span></div>`).join(""))}`,
  usage: () => `<h1>Token use</h1>${panel("Today", "", `<div class="pad">${R.usage(S.usage)}<p class="meta">At a cap Steward stops promoting; gathering keeps running.</p></div>`)}`,
  settings: () => `<h1>Settings</h1><div class="grid2">
    ${panel("Models per stage", "", `<table class="t"><tbody>${S.settings.stages.map(([n, m, e]) => `<tr><td>${n}</td><td><select><option>${m}</option></select></td><td><select><option>${e}</option></select></td></tr>`).join("")}</tbody></table>`)}
    ${panel("Promotion by complexity", "", `<table class="t"><tbody>${S.settings.complexity.map(([n, m, e]) => `<tr><td>${n}</td><td><select><option>${m}</option></select></td><td>${e ? `<select><option>${e}</option></select>` : ""}</td></tr>`).join("")}</tbody></table>`)}
    ${panel("Daily caps", "", `<table class="t"><tbody>${S.usage.map((u) => `<tr><td>${u.model}</td><td><input class="num" value="${u.cap}M" size="6" style="height:26px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel-2);padding:0 6px"></td></tr>`).join("")}</tbody></table>`)}
    ${panel("Wakes", "", `<table class="t"><tbody><tr><td>Working hours</td><td>${S.workingHours}</td></tr><tr><td>Every</td><td>30 min</td></tr></tbody></table>`)}
    ${panel("Watch PRs", "", `<div class="pad">${S.settings.signals.map((s) => `<label style="display:flex;gap:8px"><input type="checkbox" checked>${s}</label>`).join("")}</div>`, `<span class="meta">gh · webhooks and a timed check</span>`)}
    ${panel("Sources", "", `<table class="t"><tbody>${S.settings.sources.map(([n, s]) => `<tr><td>${n}</td><td>${s === "ok" ? '<span class="pill s-done">ok</span>' : `<span class="pill s-hitl">${s}</span>`}</td></tr>`).join("")}</tbody></table>`)}
  </div>`,
};
function render() {
  let cur = location.hash.slice(1); if (!views[cur]) cur = "needs";
  document.getElementById("rail").innerHTML = sections.map((s) => s === "hr" ? "<hr>" :
    `<a href="#${s[0]}" ${s[0] === cur ? 'aria-current="page"' : ""}>${s[1]}${s[2] ? `<span class="n">${s[2]}</span>` : ""}</a>`).join("");
  document.getElementById("main").innerHTML = `<div class="col">${views[cur]()}</div>`;
}
addEventListener("hashchange", render);
render();
document.getElementById("log").innerHTML = S.chat.map(R.chatMsg).join("");
document.getElementById("composer").innerHTML = R.composer();
const setChat = (open) => {
  document.getElementById("chat").hidden = !open;
  document.getElementById("shell").classList.toggle("chat-open", open);
  document.querySelector(".top [data-chat]").setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", (e) => { if (e.target.closest("[data-chat]")) setChat(document.getElementById("chat").hidden); });
setChat(new URLSearchParams(location.search).has("chat"));
</script>
</body>
</html>
